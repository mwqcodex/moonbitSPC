name: CLI example check

on:
  push:
  pull_request:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Run documented example
        run: |
          moonc -v
          compiler_version="$(moonc -v | sed -n 's/^v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p')"
          test -n "$compiler_version"
          IFS=. read -r major minor patch <<< "$compiler_version"
          if [ "$major" -lt 0 ] || { [ "$major" -eq 0 ] && [ "$minor" -lt 10 ]; } || { [ "$major" -eq 0 ] && [ "$minor" -eq 10 ] && [ "$patch" -lt 9 ]; }; then
            echo "MoonBit compiler $compiler_version is below the required v0.10.9"
            exit 1
          fi
          moon fmt --check
          moon check --deny-warn
          moon info
          test "$(moon run cmd/demo | cut -d, -f2 | tr -d ' ')" = "count=3"
