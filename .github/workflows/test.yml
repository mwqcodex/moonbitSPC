name: MoonBit checks

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install native tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Install native tools on macOS
        if: runner.os == 'macOS'
        run: brew install gcc
      - name: Install MoonBit on Unix
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          echo "$HOME/.moon/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install Windows native tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Check MoonBit project
        run: |
          moon version
          moonc -v
          compiler_version="$(moonc -v | sed -n 's/^v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p')"
          test -n "$compiler_version"
          IFS=. read -r major minor patch <<< "$compiler_version"
          if [ "$major" -lt 0 ] || { [ "$major" -eq 0 ] && [ "$minor" -lt 10 ]; } || { [ "$major" -eq 0 ] && [ "$minor" -eq 10 ] && [ "$patch" -lt 9 ]; }; then
            echo "MoonBit compiler $compiler_version is below the required v0.10.9"
            exit 1
          fi
          moon fmt --check
          moon check --deny-warn
          moon check --target all --deny-warn
          moon info
          test -f pkg.generated.mbti
          test -f cmd/demo/pkg.generated.mbti
          test -f cmd/benchmark/moon.pkg
          git diff --exit-code -- '*.mbt' '*.mbt.md' 'moon.mod' 'moon.pkg' 'cmd/**/moon.pkg'
      - name: Test wasm-gc target
        run: |
          moon test --deny-warn --enable-coverage
          moon coverage report -f summary
          moon coverage analyze
      - name: Test native target
        run: moon test --target native --deny-warn --enable-coverage
      - name: Run examples
        run: |
          moon run cmd/demo
          moon run cmd/benchmark
